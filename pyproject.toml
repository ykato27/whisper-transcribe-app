[project]
name = "whisper-transcribe-app"
version = "0.1.0"
description = "OpenAI Whisperを使った音声文字起こしアプリ（Streamlit）+ Gemini議事録生成"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.28",
    "openai-whisper>=20250625",
    "torch>=2.0",
    "pydub>=0.25",
    "google-genai>=1.0",
    "python-docx>=1.1",
    "webvtt-py>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false
